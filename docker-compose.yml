services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_job_agent_postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
    ports:
      - '${POSTGRES_PORT_BINDING:-127.0.0.1:5431}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-jobagent}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_job_agent_pgadmin_container
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    ports:
      - "${PGADMIN_PORT_BINDING:-127.0.0.1:5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: ai_job_agent_redis_container
    ports:
      - '${REDIS_PORT_BINDING:-127.0.0.1:6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_job_agent_backend_container
    ports:
      - '${BACKEND_PORT_BINDING:-127.0.0.1:4001}:4000'
    expose:
      - '4000'
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobagent}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DRY_RUN=${DRY_RUN:-true}
      - HUMAN_APPROVAL_REQUIRED=${HUMAN_APPROVAL_REQUIRED:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_ENABLED=${GROQ_ENABLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","https://localhost:3000","https://agent.jobs.shubhamprakash681.in:3000","https://agent.jobs.shubhamprakash681.in","https://agent.jobs.shubhamprakash681.in:4000"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./candidate:/app/candidate:ro
      - ./prompts:/app/prompts:ro
      - ./documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_job_agent_frontend_container
    ports:
      - '${FRONTEND_PORT_BINDING:-127.0.0.1:3001}:3000'
    expose:
      - '3000'
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:4000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://agent.jobs.shubhamprakash681.in:4000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai_job_agent_postgres_volume
  redis_data:
    name: ai_job_agent_redis_volume
  pgadmin_data:
    name: ai_job_agent_pgadmin_volume

networks:
  default:
    name: ai_job_agent_network
