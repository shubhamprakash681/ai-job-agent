# Resume Variants Configuration
# Defines how the 4 resume variants position Shubham's verified experience
variants:
  - id: "java-react-fullstack"
    name: "Java + React Full Stack"
    is_default: true
    target_roles:
      - "Full Stack Developer"
      - "Java Full Stack Engineer"
      - "Full Stack Software Engineer"
    tagline: "Full Stack Engineer | Java, Spring Boot & React Ecosystem"
    summary_emphasis: "Balanced full-stack delivery with Java/Spring Boot microservices on the backend and React/TypeScript on the frontend."
    priority_skills:
      - "Java"
      - "Spring Boot"
      - "React"
      - "TypeScript"
      - "REST APIs"
      - "Microservices"
      - "PostgreSQL"
      - "Docker"
    bullet_point_ordering:
      - "exp.tcs.bp1"       # Java + React full stack
      - "exp.tcs.bp4"       # Caching + Chart.js dashboard
      - "exp.tcs.bp2"       # Auth & JWT SSO
      - "exp.tcs.bp3"       # Spring Cloud Gateway & Eureka
      - "exp.accenture.bp1" # Enterprise microservices
      - "proj.tradex.bp1"   # Microservices platform
      - "proj.videoshare.bp1" # Full stack video platform
